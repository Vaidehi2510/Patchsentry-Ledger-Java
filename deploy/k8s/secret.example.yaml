# Not applied by kustomize. Create the real secret out of band, for example:
#   kubectl -n patchsentry create secret generic ledger-secrets \
#     --from-literal=admin-token="$(openssl rand -hex 24)" \
#     --from-literal=database-password="$(openssl rand -hex 24)"
apiVersion: v1
kind: Secret
metadata:
  name: ledger-secrets
  namespace: patchsentry
type: Opaque
stringData:
  admin-token: replace-with-at-least-16-characters
  database-password: replace-me
