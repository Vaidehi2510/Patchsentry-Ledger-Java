# Local development: docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      retries: 10
  mongo:
    image: mongo:7.0
    ports: ["27017:27017"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  ledger:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/ledger
      DATABASE_USERNAME: ledger
      DATABASE_PASSWORD: ledger
      MONGODB_URI: mongodb://mongo:27017/ledger
      REDIS_HOST: redis
      LEDGER_ADMIN_TOKEN: local-dev-admin-token
    ports: ["8080:8080"]
